<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DeckPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='18' rx='3' fill='%2314213D'/%3E%3Crect x='7' y='11' width='9' height='2.4' rx='1.2' fill='%230E9F8E'/%3E%3Crect x='7' y='16' width='16' height='2' rx='1' fill='%23C9D3E3'/%3E%3Cpath d='M11 27h10' stroke='%2314213D' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.6v.1"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 6l6 6-6 6M12 19h8"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    </defs>
  </svg>

  <header class="nav">
    <a class="brand" href="/" aria-label="DeckPilot home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="18" rx="3" fill="#fff"/><rect x="7" y="11" width="9" height="2.4" rx="1.2" fill="#0E9F8E"/><rect x="7" y="16" width="16" height="2" rx="1" fill="#14213D" opacity=".35"/><path d="M11 27.2h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>DeckPilot</span>
    </a>
    <p class="nav-tag">Topic in, researched deck out</p>
    <div id="health" class="health" role="status"><i class="hdot"></i><span>Checking services</span></div>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Your decks">
      <button class="btn ghost new" data-act="new" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>New deck</button>
      <h2 class="rail-h">Your decks</h2>
      <ul id="projects" class="plist"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <section id="console" class="console collapsed" aria-label="API console">
    <div class="console-bar">
      <button class="console-toggle" data-act="console-toggle" type="button" aria-expanded="false">
        <svg class="ic" aria-hidden="true"><use href="#i-terminal"/></svg>
        <strong>API console</strong>
        <span id="console-count" class="count">0</span>
      </button>
      <span id="console-peek" class="peek">Every request the page sends and every response it gets will appear here</span>
      <label class="check"><input type="checkbox" id="show-polling"> Show status polling</label>
      <button class="linkbtn" data-act="console-clear" type="button">Clear</button>
      <button class="linkbtn" data-act="console-toggle" id="console-toggle-label" type="button">Expand</button>
    </div>
    <div id="console-list" class="console-list"></div>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
